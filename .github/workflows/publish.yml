# Publishing to npm is a SEPARATE act from pushing to GitHub.
#
# The two registries know nothing about each other: a push (or a tag, or a
# GitHub Release) updates GitHub and NOT npm, and `npm publish` updates npm and
# not GitHub. This workflow is the bridge, and it is deliberately explicit
# about when it crosses: a published GitHub Release (or a manual run), never a
# push to main.
#
# AUTHENTICATION: npm Trusted Publishing (OIDC), so there is NO long-lived
# token in this repository — `id-token: write` is the whole credential. It
# requires a one-time setup, in this order:
#   1. publish the package ONCE by hand (`npm login && npm publish`): npm only
#      lets you register a trusted publisher for a package that exists;
#   2. on npmjs.com → the package → Settings → Trusted publishers → Add:
#      provider "GitHub Actions", owner `fhidalgodev`, repository
#      `dsh-odoo-sdd`, workflow filename `publish.yml`, environment BLANK
#      (this workflow declares none; a mismatch is a 403).
# If you would rather use a token: create a granular access token with
# "bypass 2FA", store it as the NPM_TOKEN secret and add
# `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` to the publish step's env.
name: Publish to npm

on:
  # The trigger is a RELEASE, not a push: a version published to npm can never
  # be unpublished-and-replaced the way a branch can be rewritten.
  release:
    types: [published]
  # Manual escape hatch: it runs the same gates and publishes the version in
  # package.json as it stands on the selected ref.
  workflow_dispatch:

# Least privilege, plus exactly what OIDC needs.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 on purpose: npm's OIDC trusted publishing needs npm >= 11.5.1,
      # which ships with the Node 24 line. The test matrix still covers 20/22.
      #
      # `registry-url` is DELIBERATELY absent. With it, setup-node writes
      # `_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc and exports a placeholder
      # value when no real token is in the environment; npm then sends that
      # placeholder as a bearer token on the publish PUT, gets a 404, and never
      # falls back to the OIDC trusted-publisher flow — even though
      # `--provenance` already signs through OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ''

      # Configure the registry with NO auth token, so the only credential npm
      # can use is the OIDC token issued for `id-token: write`.
      - name: Configure the registry without a token
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Install host packages (the optional peers, needed to compile)
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@^0.1.2-rc.1

      # The same gates as CI. A publish that skips them would be a release
      # nobody tested, and npm versions are immutable.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # This is the step that would have caught a tarball shipping without its
      # compiled entry point; it runs the publish simulation.
      - name: Packaging contract (tarball contents)
        run: npm run test:package

      # A tag says v0.2.0 while package.json says 0.1.0 more often than anyone
      # expects. Publishing the wrong version is not undoable, so refuse.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=$TAG version=$VERSION"
          if [ "v$VERSION" != "$TAG" ] && [ "$VERSION" != "$TAG" ]; then
            echo "::error::the release tag ($TAG) does not match package.json ($VERSION)"
            exit 1
          fi

      # npm rejects a version that already exists, but failing here says WHY
      # instead of leaving a red X on an opaque 403.
      - name: Check the version is not published yet
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on the registry; bump the version"
            exit 1
          fi
          echo "$NAME@$VERSION is free to publish."

      # Preflight: the two silent killers of OIDC publishing, checked out loud
      # BEFORE anything is attempted. npm's own failure for both is a 404 that
      # points at nothing, so the log has to carry the answer instead.
      - name: Preflight the OIDC prerequisites
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          NPM_MAJOR=$(npm -v | cut -d. -f1)
          NPM_MINOR=$(npm -v | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "::error::trusted publishing needs npm >= 11.5.1 (have $(npm -v)); use node-version 24.x or upgrade npm"
            exit 1
          fi
          # The OIDC request URL only exists when `id-token: write` reached the
          # job; without it npm has nothing to authenticate with.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC token endpoint: the job is missing 'permissions: id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint: present"
          echo "workflow identity npm will verify: ${{ github.workflow_ref }}"
          echo "job environment: NONE declared by this job, so the 'Environment name'"
          echo "                 field on npmjs.com must be empty as well."

      # `prepack` rebuilds lib/ here, so the tarball cannot be built from a
      # stale tree even if the steps above changed something.
      - name: Publish (OIDC trusted publishing, with provenance)
        id: publish
        run: npm publish --provenance --access public

      # npm reports BOTH of the misconfigurations below as the same misleading
      # 404 on the PUT, so say what to check while the failure is still fresh.
      - name: Diagnose a failed publish
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          cat <<'CHECKLIST'
          ::error::The publish was rejected. Two misconfigurations produce this same 404:
            1. Environment mismatch. This job declares NO environment, so the
               "Environment name" field on npmjs.com (package → Settings → Trusted
               publishers) must be EMPTY. If it has a value, either clear it or
               declare `environment: <name>` on this job so both agree.
            2. Trusted publisher identity. On npmjs.com it must read exactly:
               provider GitHub Actions · owner fhidalgodev · repository dsh-odoo-sdd
               · workflow filename publish.yml · environment (blank).
               A path instead of a filename (`.github/workflows/publish.yml`) does
               not match.
            If both look right, compare `npm -v` above: npm older than 11.5.1
            cannot do the OIDC exchange at all.
          CHECKLIST

      - name: Show what the registry actually has
        run: |
          NAME=$(node -p "require('./package.json').name")
          npm view "$NAME" version dist-tags --json
