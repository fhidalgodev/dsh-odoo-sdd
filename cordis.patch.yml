# dsh-odoo-sdd bundle patch.
#
# This bundle is a single Cordis plugin (name "odoo-sdd"): its apply()
# registers the odoo_* + sdd_phase tools. To mount it into a profile, this
# patch inserts the one row the Loader resolves against `dsh-odoo-sdd`.
#
# The profile's own cordis.patch.yml may override `config` by row id
# (`odoo-sdd`) — e.g. to set a concrete projectRoot or allowlist.
#
# projectRoot is only a FALLBACK: the effective root of a call is the cwd of
# the session that makes it (the folder the developer opened in DSH). The
# deployment value applies to hosts/contexts with no session (headless, CI).
#
# Security: executeAllowlist defaults to EMPTY, so odoo_execute mutations
# (create/write/unlink) are denied until the deployment lists models.

- insert:
    - id: odoo-sdd
      name: 'dsh-odoo-sdd'
      config:
        projectRoot: ''
        # Where specs live: 'project' = <projectRoot>/<specsDir>, one set of
        # specs per repository; 'central' = every project's specs collected
        # under specsRoot, each project in its own subfolder.
        specsMode: 'project'
        specsRoot: ''
        specsDir: 'specs'
        executeAllowlist: []
        # Business actions a functional batch may call, as "model.method" (or
        # "model:method"): action_confirm, action_assign, button_validate…
        # Empty = no method beyond create/write/unlink can run.
        methodAllowlist: []
        # Odoo source repositories: URL or local OS path (empty path = use URL).
        communityRepoUrl: 'https://github.com/odoo/odoo'
        communityRepoPath: ''
        enterpriseRepoUrl: 'https://github.com/odoo/enterprise'
        enterpriseRepoPath: ''
        # Defaults surfaced and edited in Settings → Odoo SDD.
        autonomy: 'supervised'
        licensed: 'community'
        # Fail-closed policy guards (edited in Settings too).
        requireCheckpointBeforeMutation: true
        # Nothing changes without a spec that authorizes it (a writing phase) or
        # a waiver the developer approved for THIS session. Covers instance
        # mutations and edits of project files alike.
        requireSpecForChanges: true
        securityReviewRequired: true
        securityInterviewRequired: true
        auditAllTools: true
        maxCheckpoints: 5
        # Documentation gate: "required" blocks DONE, "optional" only reports,
        # "off" skips the gate. Language defaults to English until the project's
        # own rules file (or an explicit choice) says otherwise.
        documentationPolicy: 'required'
        documentationLanguage: ''
