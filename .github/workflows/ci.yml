name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Main matrix: the contract with the CURRENT host, on both supported Node lines
  # and both supported operating systems. The plugin claims cross-platform
  # support, so the claim is TESTED rather than asserted in a README: Windows
  # differs in POSIX mode bits (chmod is only a read-only flag), in rename
  # semantics (an open handle makes MoveFileEx fail with EPERM/EBUSY, which the
  # atomic writer retries) and in path separators.
  build-test:
    name: build-test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20 is EOL and receives no security patches, but the plugin still
        # DECLARES node >=20 in engines: the floor you claim is the floor you
        # must test, or the claim is unverified. 24 is what the publish job uses.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # No npm cache: the plugin intentionally has no package-lock.json
          # (peers are optional + a host package is installed ad-hoc below).
          # `cache: npm` would fail with "lock file is not found".
          # Consequence, stated so nobody expects it: without a lockfile there is
          # no `npm ci` and no `npm audit` (SCA needs a lockfile to resolve).
          cache: ''

      # ONE install, and it is the install a user performs. The host packages
      # the plugin IMPORTS (dsh-tools, schemastery) are devDependencies, so npm
      # puts them at the top of the tree on every OS. They used to arrive from a
      # second, ad-hoc `npm run host:deps`: the 0.2.x launcher nests its whole
      # closure under its own node_modules, so whether `tsc` could resolve the
      # types depended on where npm decided to hoist — and on Windows two jobs of
      # the same matrix decided differently (TS2307 in one, clean in the other).
      # The FLOOR is a separate question, answered by the host-contract job.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # One step per group of suites: the failing step NAMES the suite that
      # broke, and scripts/ci-test.sh keeps the tail of a failed run readable
      # (step summary + annotations), because a job log is not always reachable.
      - name: "Tests: server invariants and host contract"
        shell: bash
        run: bash scripts/ci-test.sh tests/smoke.mjs tests/spec-reqs.mjs tests/test-scan.mjs

      - name: "Tests: client bundle and README"
        shell: bash
        run: bash scripts/ci-test.sh tests/client.mjs tests/readme.mjs

      - name: "Tests: functional and import"
        shell: bash
        run: bash scripts/ci-test.sh tests/functional.mjs tests/import.mjs

      - name: "Tests: narrated manuals"
        shell: bash
        run: bash scripts/ci-test.sh tests/manual.mjs

      - name: "Tests: narrated video"
        shell: bash
        run: bash scripts/ci-test.sh tests/video.mjs

      - name: "Tests: capture pipeline"
        shell: bash
        run: bash scripts/ci-test.sh tests/capture.mjs

      # Guards the class of bug that only shows up AFTER installation: a file
      # the runtime loads by path but `files` leaves out of the tarball — the
      # install hook is the case that bit: `npm rebuild` runs `prepare`, and a
      # tarball without `scripts/prepare.mjs` broke the first command Windows
      # users are told to run. It runs through ci-test.sh like any other suite so
      # the CI-drift check inside it can see this step.
      - name: "Tests: packaging contract (tarball contents)"
        shell: bash
        run: bash scripts/ci-test.sh tests/package.mjs

  # Contract floor: the oldest host this plugin CLAIMS to support. The host
  # contract is version-sensitive (execution.arguments vs args was such a
  # break), so the declared floor is verified rather than assumed. The floor is
  # read from `engines.dsh`, because the host enforces THAT field and ignores
  # peerDependencies; a floor read from a peer would test a host the plugin
  # refuses to load on. If this job fails, RAISE the declared floor in
  # package.json — never weaken the guard.
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # The 0.2.x host declares node >= 24.9.0, and the floor is only a
          # meaningful floor on a runtime that can actually host it.
          node-version: 24
          cache: ''

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      # `host:deps` is the same install every user runs; here the version is
      # pinned to the declared floor instead of a range. The failure text goes
      # into annotations: a job log needs a token, a check run does not.
      - name: Install the declared host floor
        run: |
          FLOOR=$(node -p "require('./package.json').engines.dsh.match(/\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?/)[0]")
          echo "Declared floor: $FLOOR"
          log="${RUNNER_TEMP:-/tmp}/host-floor.log"
          if ! npm install --no-save --no-audit --no-fund "@deepseek-ai/dsh@$FLOOR" >"$log" 2>&1; then
            tail -n 40 "$log" >&2 || true
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line//%/%%}"
            done < <(tail -n 20 "$log")
            exit 1
          fi
          tail -n 5 "$log"

      - name: Typecheck against the floor
        run: npm run typecheck

      - name: Build against the floor
        run: npm run build

      - name: Tests against the floor
        run: npm test

  # The capture pipeline (Fase 3) needs a REAL browser: the E2E drives a fake
  # Odoo served on loopback through the same Chromium the tool launches.
  capture-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium + bundled ffmpeg for playwright-core
        # Browser download FIRST (Playwright CDN, never apt): hosted runners
        # periodically lose DNS for the ubuntu mirrors ("Temporary failure
        # resolving 'security.ubuntu.com'"), and an apt install then spends tens
        # of minutes retrying before failing. The system libraries are fetched
        # only when headless chromium cannot actually launch, which is rare —
        # the ubuntu image already ships them.
        run: |
          npx playwright-core install chromium ffmpeg
          if node -e "require('playwright-core').chromium.launch().then(b => b.close()).catch(e => { console.error(String(e)); process.exit(1); })"; then
            echo "headless chromium launches with the libraries already in the image"
          else
            echo "::warning::headless chromium needs system libraries — installing them"
            npx playwright-core install-deps chromium
          fi

      - name: Capture E2E (browser required)
        run: ODOO_SDD_REQUIRE_BROWSER=1 node tests/capture.mjs

      # The UI-verification layer shares the same engine and the same fake
      # Odoo: a capture can PASS on a screen that shows a traceback, this
      # suite proves the probe fails it with the right finding kind.
      - name: UI verify E2E (browser required)
        run: ODOO_SDD_REQUIRE_BROWSER=1 bash scripts/ci-test.sh tests/ui-verify.mjs

      # The video assembly is verified against the runner's REAL ffmpeg
      # (synthetic testsrc webm → narrated mp4): the unit layer fakes ffmpeg,
      # this step proves the actual flag/filter pipeline still works. The
      # binary is installed explicitly and named through ODOO_SDD_FFMPEG, so a
      # failure is never "the image happened to ship a different ffmpeg": the
      # version that ran is printed in the log either way.
      - name: Video E2E (ffmpeg required)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -1
          # Through ci-test.sh so a failing check is NAMED in the annotations:
          # the job log needs a token to read, the check run does not.
          ODOO_SDD_FFMPEG="$(command -v ffmpeg)" ODOO_SDD_REQUIRE_FFMPEG=1 bash scripts/ci-test.sh tests/video.mjs

  # Windows really assembles a video
  #
  # Every other Windows step runs against a FAKE ffmpeg — the fake is a POSIX
  # shebang script, so the whole happy path is SKIPPED there and the Windows
  # matrix only ever saw error paths. The concat lists used to carry absolute
  # paths, which is a defect Windows alone can expose (a backslash is an escape
  # and `C:` is parsed as a protocol), so the real toolchain runs here with
  # ffmpeg from Chocolatey.
  video-e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      # bash, because `VAR=1 node …` is not PowerShell syntax and Git Bash ships
      # on the Windows runner. The binary is left to PATH ("ffmpeg"): a POSIX
      # path from `command -v` is not what a Windows child process resolves, so
      # only the version is printed for the log. ci-test.sh names the failing
      # check in an annotation, which is readable without a token.
      - name: Video E2E on Windows (ffmpeg required)
        shell: bash
        run: |
          ffmpeg -version | head -1
          ODOO_SDD_REQUIRE_FFMPEG=1 bash scripts/ci-test.sh tests/video.mjs
